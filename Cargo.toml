[package]
name = "spark-rsi"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <drake.aien@proton.me>"]
description = "High-performance native Rust and Mojo Recursive Self-Improvement (RSI) engine for autonomous AI agents"
license = "Apache-2.0 WITH LLVM-exception"

[[bin]]
name = "spark-rsi"
path = "src/main.rs"

[[bin]]
name = "spark-rsi-supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
name = "spark-rsi-judge"
path = "src/actor/judge.rs"

[lib]
name = "spark_rsi"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.8", features = ["v4"] }
libc = "0.2"
p256 = { version = "0.14.0", features = ["ecdsa"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
strip = true
