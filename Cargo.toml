[package]
name = "spark-rsi"
version = "0.1.0"
edition = "2021"
authors = ["AIEN <aien.atlas@proton.me>"]
description = "High-performance native Rust and Mojo Recursive Self-Improvement (RSI) engine for autonomous AI agents"
license = "MIT OR Apache-2.0"

[[bin]]
name = "spark-rsi"
path = "src/main.rs"

[lib]
name = "spark_rsi"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
strip = true
